name: Release portable desktop applications
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag with the reviewed source changes
        required: true
      workbench_ref:
        description: Authorized Workbench UI full commit SHA
        required: true
      webview2_url:
        description: Microsoft Fixed Version x64 CAB URL
        required: true
      webview2_sha256:
        description: Reviewed Fixed Version CAB SHA-256
        required: true

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
  WORKBENCH_REF: ${{ inputs.workbench_ref || vars.WORKBENCH_UI_REF }}
  WEBVIEW2_URL: ${{ inputs.webview2_url || vars.WEBVIEW2_FIXED_URL }}
  WEBVIEW2_SHA256: ${{ inputs.webview2_sha256 || vars.WEBVIEW2_FIXED_SHA256 }}

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
          - os: macos-latest
            artifact: macos-arm64
          - os: macos-15-intel
            artifact: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Validate explicit build inputs
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+([+-].+)?$') { throw 'A release tag is required' }
          if ($env:WORKBENCH_REF -notmatch '^[0-9a-fA-F]{40}$') { throw 'Set WORKBENCH_UI_REF to an authorized full commit SHA, or use workflow_dispatch' }
          if ($env:WEBVIEW2_SHA256 -notmatch '^[0-9a-fA-F]{64}$') { throw 'Set WEBVIEW2_FIXED_SHA256, or use workflow_dispatch' }
          if (-not $env:WEBVIEW2_URL) { throw 'Set WEBVIEW2_FIXED_URL, or use workflow_dispatch' }
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/checkout@v4
        with:
          repository: gaze9999/workbench-ui
          ref: ${{ env.WORKBENCH_REF }}
          path: .build-inputs/workbench-ui
          token: ${{ secrets.WORKBENCH_UI_READ_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/gui/frontend/package-lock.json
      - run: python -m pip install -r setup/requirements-build.txt
      - if: runner.os == 'Windows'
        shell: pwsh
        run: python launch-cli.py gui.packaging.fetch_webview2 --url "$env:WEBVIEW2_URL" --sha256 "$env:WEBVIEW2_SHA256" --output setup/runtime
      - name: Build desktop through release helper
        shell: pwsh
        run: |
          $buildArgs = @('launch-cli.py', 'scripts.release', 'desktop', $env:RELEASE_TAG, '--workbench-ui', '.build-inputs/workbench-ui')
          if ($IsWindows) { $buildArgs += @('--webview2-runtime', 'setup/runtime/WebView2') }
          python @buildArgs
          if ($LASTEXITCODE -ne 0) { throw 'Desktop release build failed' }
      - name: Verify native application and bundled bridge
        shell: pwsh
        run: |
          $manifest = Get-ChildItem dist/desktop -Filter desktop-manifest.json -Recurse | Select-Object -First 1
          $metadata = Get-Content $manifest.FullName -Raw | ConvertFrom-Json
          $executable = Join-Path $manifest.DirectoryName $metadata.entrypoints.gui
          if ($IsWindows) {
            $process = Start-Process -FilePath $executable -ArgumentList '--smoke-test' -PassThru -WindowStyle Hidden
          } else {
            $process = Start-Process -FilePath $executable -ArgumentList '--smoke-test' -PassThru
          }
          if (-not $process.WaitForExit(180000)) { $process.Kill($true); throw 'Native GUI verification timed out' }
          if ($process.ExitCode -ne 0) { throw 'Native GUI verification failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.artifact }}
          path: |
            dist/desktop/**/*.zip
            dist/desktop/**/*.exe
            dist/desktop/**/desktop-manifest-*.json
          if-no-files-found: error

  cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
          - os: macos-latest
            artifact: macos-arm64
          - os: macos-15-intel
            artifact: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Validate CLI release tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+([+-].+)?$') { throw 'A release tag is required' }
          if ($env:WORKBENCH_REF -notmatch '^[0-9a-fA-F]{40}$') { throw 'A committed Workbench UI SHA is required' }
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r setup/requirements-cli-build.txt
      - uses: actions/checkout@v4
        with:
          repository: gaze9999/workbench-ui
          ref: ${{ env.WORKBENCH_REF }}
          path: .build-inputs/workbench-ui
          token: ${{ secrets.WORKBENCH_UI_READ_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/gui/frontend/package-lock.json
      - name: Build independent CLI through release helper
        shell: pwsh
        run: |
          python launch-cli.py scripts.release cli "$env:RELEASE_TAG" --workbench-ui .build-inputs/workbench-ui
          if ($LASTEXITCODE -ne 0) { throw 'CLI release build failed' }
      - name: Verify native CLI without a source checkout or local Python
        shell: pwsh
        run: |
          $marker = Get-ChildItem dist/cli -Filter 'cli-manifest-*.json' -Recurse | Select-Object -First 1
          $metadata = Get-Content $marker.FullName -Raw | ConvertFrom-Json
          $executable = Join-Path $marker.DirectoryName $metadata.entrypoints.cli
          $executable = (Resolve-Path -LiteralPath $executable).Path
          $fixture = Join-Path $env:RUNNER_TEMP ('my-py-tools-cli-' + [guid]::NewGuid().ToString() + '.txt')
          $markdown = [IO.Path]::ChangeExtension($fixture, '.md')
          Push-Location $env:RUNNER_TEMP
          try {
            & $executable --list
            if ($LASTEXITCODE -ne 0) { throw 'CLI list failed' }
            $tokens = & $executable text.tokenizer --text hello --json | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $tokens.chars -ne 5 -or $tokens.method -ne 'tiktoken') { throw 'Offline CLI tokenizer failed' }
            Set-Content -LiteralPath $fixture -Value 'Portable CLI document verification' -Encoding utf8
            & $executable documents.convert_to_markdown $fixture
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $markdown)) { throw 'Native CLI extraction failed' }
            & $executable scripts.release prepare --dry-run
            if ($LASTEXITCODE -eq 0) { throw 'Frozen CLI must not execute source-only release tools' }
            $global:LASTEXITCODE = 0
          } finally {
            Pop-Location
            foreach ($path in @($fixture, $markdown)) { if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path } }
          }
      - name: Verify shared browser mode with the bundled CLI worker
        shell: pwsh
        run: |
          $marker = Get-ChildItem dist/cli -Filter 'cli-manifest-*.json' -Recurse | Select-Object -First 1
          $metadata = Get-Content $marker.FullName -Raw | ConvertFrom-Json
          $executable = Join-Path $marker.DirectoryName $metadata.entrypoints.cli
          python launch-cli.py distribution.smoke_cli $executable
          if ($LASTEXITCODE -ne 0) { throw 'Portable CLI browser verification failed' }
          if ($IsWindows) {
            $terminal = Join-Path $marker.DirectoryName $metadata.entrypoints.cmd
            $browser = Join-Path $marker.DirectoryName $metadata.entrypoints.web_cmd
            & $terminal --list
            if ($LASTEXITCODE -ne 0) { throw 'Terminal CMD entry point failed' }
            & $browser --port -1
            if ($LASTEXITCODE -ne 2) { throw 'Browser CMD argument forwarding failed' }
            $terminalPs1 = Join-Path $marker.DirectoryName $metadata.entrypoints.ps1
            $browserPs1 = Join-Path $marker.DirectoryName $metadata.entrypoints.web_ps1
            & $terminalPs1 --list
            if ($LASTEXITCODE -ne 0) { throw 'Terminal PS1 entry point failed' }
            & $browserPs1 --port -1
            if ($LASTEXITCODE -ne 2) { throw 'Browser PS1 argument forwarding failed' }
            $global:LASTEXITCODE = 0
          }
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.artifact }}
          path: |
            dist/cli/**/*.zip
            dist/cli/**/cli-manifest-*.json
          if-no-files-found: error

  publish:
    needs: [desktop, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: desktop-assets
      - name: Publish only cloud-built, verified portable assets
        shell: pwsh
        run: |
          $release = gh api "repos/$env:GH_REPO/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.draft) { throw 'A published release is required' }
          $assets = @(Get-ChildItem desktop-assets -File -Recurse | Where-Object { $_.Extension -in @('.zip', '.exe') -or $_.Name -like 'desktop-manifest-*.json' -or $_.Name -like 'cli-manifest-*.json' })
          if ($assets.Count -ne 12) { throw 'Expected Windows GUI EXE, macOS GUI ZIPs, separate CLI ZIPs and six manifests' }
          foreach ($asset in $assets) {
            if ($release.assets.name -contains $asset.Name) { throw "Existing release asset will not be overwritten: $($asset.Name)" }
          }
          gh release upload $env:RELEASE_TAG @($assets.FullName)
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          $published = gh api "repos/$env:GH_REPO/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify published release' }
          foreach ($asset in $assets) {
            $remote = @($published.assets | Where-Object name -eq $asset.Name)
            $hash = 'sha256:' + (Get-FileHash $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($remote.Count -ne 1 -or $remote[0].size -ne $asset.Length -or $remote[0].digest -ne $hash) { throw "Published asset mismatch: $($asset.Name)" }
          }
